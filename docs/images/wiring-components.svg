<svg xmlns="http://www.w3.org/2000/svg" width="620" height="740" viewBox="0 0 620 740">
  <title>Component illustrations for the confirmed robot arm wiring diagram</title>
  <desc>Original SVG artwork: Mac laptop, bench power supply, black-cased metal gear servo and PCA9685 board. Shapes and pin placement are schematic.</desc>
  <defs>
    <linearGradient id="metal" x2="0" y2="1">
      <stop stop-color="#e8edf2"/><stop offset="0.45" stop-color="#c1cad4"/><stop offset="1" stop-color="#8794a3"/>
    </linearGradient>
    <linearGradient id="screen" x2="0.7" y2="1">
      <stop stop-color="#0f2945"/><stop offset="1" stop-color="#225681"/>
    </linearGradient>
    <linearGradient id="servo-housing" x2="0.3" y2="1">
      <stop stop-color="#454a52"/><stop offset="0.45" stop-color="#30353d"/><stop offset="1" stop-color="#1e232a"/>
    </linearGradient>
    <linearGradient id="servo-brass">
