      <text x="22" y="535" fill="#bbdfce" font-family="Arial, sans-serif" font-size="12">CH0–CH5 connected</text>
      <text x="22" y="559" fill="#bbdfce" font-family="Arial, sans-serif" font-size="12">I²C address 0x40</text>
