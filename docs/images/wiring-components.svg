      <path d="M61 71H157M61 83H157M61 95H157" stroke="#cedae8" stroke-width="3"/>
      <circle cx="107" cy="71" r="4" fill="#3476ad"/><circle cx="133" cy="83" r="4" fill="#3476ad"/><circle cx="90" cy="95" r="4" fill="#3476ad"/>
