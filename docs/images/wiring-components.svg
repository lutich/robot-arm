  <rect width="620" height="740" fill="#fff"/>
  <use href="#mac-laptop" x="20" y="20"/>
  <use href="#bench-supply" x="60" y="260"/>
  <use href="#metal-servo" x="60" y="440"/>
  <use href="#pca-board" x="350" y="20"/>
