      <path d="M191 91H231M218 88L211 73L196 67L191 78" fill="none" stroke="#486b91" stroke-width="4" stroke-linejoin="round"/>
      <path d="M26 125H274L300 176Q300 181 291 183H9Q0 181 0 176Z" fill="url(#metal)" stroke="#536173" stroke-width="2"/>
