      <circle cx="51" cy="210" r="10" fill="#aebdb1" stroke="#365443" stroke-width="2"/>
      <circle cx="51" cy="238" r="10" fill="#aebdb1" stroke="#365443" stroke-width="2"/>
      <path d="M46 210H56M46 238H56" stroke="#365443" stroke-width="2"/>
      <g fill="#15362c" stroke="#6eaa8e">
        <rect x="236" y="40" width="12" height="70" rx="3"/><rect x="236" y="150" width="12" height="70" rx="3"/>
        <rect x="236" y="260" width="12" height="70" rx="3"/><rect x="236" y="370" width="12" height="70" rx="3"/>
        <rect x="236" y="480" width="12" height="70" rx="3"/><rect x="236" y="590" width="12" height="70" rx="3"/>
