[project]
name = "armsim"
version = "0.1.0"
description = "MuJoCo sandbox for the six-servo robot arm, driven through the robot-arm control API"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.2,<4",
    "numpy>=1.26",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["armsim"]
